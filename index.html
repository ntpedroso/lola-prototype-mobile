<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lolá - Entre com sua conta</title>

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    @theme {
      --color-salmao: #EB877C;
      --color-turquesa: #5FDBD7;
      --color-turquesa-escuro: #18716E;
      --color-amarelo: #F9D949;
      --color-roxo: #C57BDB;
      --color-roxo-escuro: #8F36A9;
      --color-salmao-escuro: #B52919;
      --color-text: #444444;
    }

      @keyframes encaixeElastico {
        0% {
          opacity: 0;
          transform: translateY(-600px) scaleY(1) scaleX(0.8); /* Inicia no alto e esticado */
        }
        60% {
          opacity: 1;
          transform: translateY(25px) scaleY(1) scaleX(1.2);   /* Passa do centro e achata ao "bater" */
        }
        75% {
          transform: translateY(-25px) scaleY(1.1) scaleX(0.9);   /* Dá um pequeno salto de volta */
        }
        90% {
          transform: translateY(3px) scaleY(0.98) scaleX(1.02);  /* Ajuste fino final */
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);                     /* Encaixa perfeitamente no centro */
        }
      }

      .logo-elastico {
        animation: encaixeElastico 1.2s cubic-bezier(0.25,1,0.5,1) forwards;
      }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex justify-center items-center">
  <!--splash screen-->
  <div
    class="fixed z-50 w-full h-full max-w-md bg-turquesa flex flex-col justify-center items-center transition-opacity duration-700"
    id="splash-screen">
    <div class="opacity-0 transition-opacity duration-3000 ease-in-out" id="logo-nuvem">
      <img src="img/logo-nuvem.svg">
    </div>
    <div class="absolute flex justify-center items-center logo-elastico" id="logo-letreiro">
      <img src="img/logo-letreiro.svg">
    </div>
    <div>

    </div>
  </div>

  <main class="w-full max-w-md">
    <div class="relative">
      <img src="img/background-index.svg" class="object-fill">
        <a href="login.html" class="absolute inset-0 top-150 m-auto h-fit w-fit z-10 bg-salmao text-white font-semibold py-3 px-8 rounded-full">FAZER LOGIN</a>
    </div>
  </main>

</body>

<script>
  //executa assim que a página é carregada
  window.addEventListener('load', () => {
    const nuvem = document.getElementById('logo-nuvem');
    const letreiro = document.getElementById('logo-letreiro');

    nuvem.classList.remove('opacity-0');
    nuvem.classList.add('opacity-100');
    letreiro.classList.remove('-mt-500');
    letreiro.classList.remove('opacity-0');
    letreiro.classList.add('opacity-100');
  });

  window.addEventListener('DOMContentLoaded', () => {
    const tempo_splash = 2500;

    setTimeout(() => {
      const splash_screen = document.getElementById('splash-screen');

      splash_screen.classList.remove('opacity-100');
      splash_screen.classList.add('opacity-0');

      setTimeout(() => {
        splash_screen.classList.add('hidden');
      }, 700);
    }, tempo_splash);
  });

</script>

</html>
