<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lolá - Entre com sua conta</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    @theme {
      --color-salmao: #EB877C;
      --color-turquesa: #5FDBD7;
      --color-turquesa-escuro: #18716E;
      --color-amarelo: #F9D949;
      --color-roxo: #C57BDB;
      --color-roxo-escuro: #8F36A9;
      --color-salmao-escuro: #B52919;
      --color-text: #444444;
    }

    @keyframes encaixeElastico {
      0% {
        opacity: 0;
        transform: translateY(-600px) scaleY(1) scaleX(0.8);
      }

      60% {
        opacity: 1;
        transform: translateY(25px) scaleY(1) scaleX(1.2);
      }

      75% {
        transform: translateY(-25px) scaleY(1.1) scaleX(0.9);
      }

      90% {
        transform: translateY(3px) scaleY(0.98) scaleX(1.02);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .logo-elastico {
      animation: encaixeElastico 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-dvh flex justify-center">

  <main class="relative w-full max-w-md h-dvh overflow-hidden">

    <img
      src="img/background-index.svg"
      class="absolute inset-0 w-full h-full object-cover"
      alt=""
    >

    <a
      href="login.html"
      class="absolute bottom-12 left-1/2 -translate-x-1/2 z-10 bg-salmao text-white font-semibold py-3 px-8 rounded-full shadow whitespace-nowrap"
    >
      FAZER LOGIN
    </a>

    <div
      id="splash-screen"
      class="absolute inset-0 z-50 w-full h-full bg-turquesa flex flex-col justify-center items-center transition-opacity duration-700"
    >

      <div
        id="logo-nuvem"
        class="opacity-0 transition-opacity duration-3000 ease-in-out"
      >
        <img src="img/logo-nuvem.svg" alt="Logo Lolá">
      </div>

      <div
        id="logo-letreiro"
        class="absolute flex justify-center items-center logo-elastico"
      >
        <img src="img/logo-letreiro.svg" alt="Lolá">
      </div>

    </div>

  </main>

  <script>
    window.addEventListener('load', () => {
      const nuvem = document.getElementById('logo-nuvem');

      nuvem.classList.remove('opacity-0');
      nuvem.classList.add('opacity-100');
    });

    window.addEventListener('DOMContentLoaded', () => {
      const tempoSplash = 2500;

      setTimeout(() => {
        const splashScreen = document.getElementById('splash-screen');

        splashScreen.classList.add('opacity-0');

        setTimeout(() => {
          splashScreen.classList.add('hidden');
        }, 700);

      }, tempoSplash);
    });
  </script>

</body>

</html>
