<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lolá - Entre com sua conta</title>

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    @theme {
      --color-salmao: #EB877C;
      --color-turquesa: #5FDBD7;
      --color-turquesa-escuro: #18716E;
      --color-amarelo: #F9D949;
      --color-roxo: #C57BDB;
      --color-roxo-escuro: #8F36A9;
      --color-salmao-escuro: #B52919;
      --color-text: #444444;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <!--splash screen-->
  <div class="fixed w-full h-full bg-turquesa flex flex-col justify-center items-center">
    <div class="opacity-0 transition-opacity duration-3000 ease-in-out" id="logo-nuvem">
      <img src="img/logo-nuvem.svg">
    </div>
    <div class="absolute flex justify-center items-center opacity-0 transition-opacity -mt-0 duration-8000 ease-in-out" id="logo-letreiro">
      <img src="img/logo-letreiro.svg">
    </div>
    <div>

    </div>
  </div>
  <main class="w-full max-w-sm">

  </main>
    
</body>

<script>
  //executa assim que a página é carregada
  window.addEventListener('load', () => {
    const nuvem = document.getElementById('logo-nuvem');
    const letreiro = document.getElementById('logo-letreiro');

    nuvem.classList.remove('opacity-0');
    nuvem.classList.add('opacity-100');
    letreiro.classList.remove('-mt-500');
    letreiro.classList.remove('opacity-0');
    letreiro.classList.add('opacity-100');
  });

</script>
</html>
