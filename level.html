<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lolá - Entre com sua conta</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
      @theme {
        --color-salmao: #eb877c;
        --color-turquesa: #5fdbd7;
        --color-turquesa-escuro: #18716e;
        --color-amarelo: #f9d949;
        --color-roxo: #c57bdb;
        --color-roxo-escuro: #8f36a9;
        --color-salmao-escuro: #b52919;
        --color-text: #444444;
        --font-roboto: "Roboto", sans-serif;
      }

      @keyframes subirTitulo {
        0% {
          transform: translateY(100vh);
          opacity: 0;
        }

        75% {
          transform: translateY(-12px);
          opacity: 1;
        }

        90% {
          transform: translateY(5px);
        }

        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .animar-titulo {
        animation: subirTitulo 1.5s ease-out forwards;
      }

      @keyframes andarAvatar {
        from {
          transform: translate(0, 0);
        }

        to {
          transform: translate(100px, -160px);
        }
      }

      .animarAvatar {
        animation: andarAvatar 1.5s linear forwards;
      }

      @keyframes desaparecerAvatar {
        from {
          opacity: 1;
          transform: translate(100px, -160px);
        }

        to {
          opacity: 0;
          transform: translate(100px, -160px);
        }
      }

      .desaparecer {
        animation: desaparecerAvatar 1s ease forwards;
      }

      @keyframes desaparecerPagina {
        from {
          opacity: 1;
        }

        to {
          opacity: 0;
        }
      }

      .desaparecer-pagina {
        animation: desaparecerPagina 1.5s ease forwards;
      }
    </style>
  </head>

  <body class="bg-gray-100 h-dvh flex items-center justify-center" id="pagina">
    <main
      class="w-full max-w-sm h-dvh bg-[url('img/level-home-1.svg')] bg-cover bg-center bg-no-repeat relative"
      id="bg-casa-fechada"
    >
      <div class="absolute top-10 left-1/2 -translate-x-1/2 animar-titulo">
        <div
          class="bg-white/90 border-4 border-salmao rounded-2xl px-10 py-3 shadow-lg text-center whitespace-nowrap font-roboto"
        >
          <p class="text-salmao text-sm font-bold uppercase tracking-widest">
            Nível 01
          </p>

          <h1 class="text-text font-bold text-2xl">A Fazenda</h1>
        </div>
      </div>

      <div class="absolute top-115 left-10" id="avatar">
        <img src="img/avatar-natasha.svg" />
      </div>
    </main>
  </body>
  <script>
    const cenario = document.getElementById("bg-casa-fechada");

    const avatar = document.getElementById("avatar");

    const proximoCenario = new Image();
    proximoCenario.src = "img/level-home-2.svg";

    const pagina = document.getElementById("pagina");

    setTimeout(() => {
      cenario.style.backgroundImage = "url('img/level-home-2.svg')";

      setTimeout(() => {
        avatar.classList.add("animarAvatar");
      }, 300);
    }, 2000);

    avatar.addEventListener("animationend", (event) => {
      if (event.animationName === "andarAvatar") {
        avatar.classList.add("desaparecer");
      }
      if (event.animationName === "desaparecerAvatar") {
        pagina.classList.add("desaparecer-pagina");
      }
    });

    pagina.addEventListener("animationend", (event) => {
      if (event.animationName === "desaparecerPagina") {
        window.location.href = "nivel-01.html";
      }
    });
  </script>
</html>
